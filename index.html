<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0e14">
  <title>Controle VIP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23f5c451' d='M3 18h18l-1.5-10-5 4L12 5l-2.5 7-5-4z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <!-- Tela de senha -->
  <section id="lock" class="lock">
    <form id="lockForm" class="lock-card">
      <div class="crown big">
        <svg viewBox="0 0 24 24"><path d="M3 18h18l-1.5-10-5 4L12 5l-2.5 7-5-4z"/></svg>
      </div>
      <h1>Controle <span class="grad">VIP</span></h1>
      <p class="muted">Área restrita. Os dados ficam criptografados — digite a senha para abrir.</p>
      <input id="lockPw" type="password" placeholder="Senha" autocomplete="current-password" required>
      <label class="check"><input id="lockRemember" type="checkbox"> Lembrar neste aparelho</label>
      <button class="btn primary block" type="submit">Desbloquear</button>
      <p id="lockErr" class="err" hidden></p>
    </form>
  </section>

  <!-- App -->
  <main id="app" hidden>
    <header class="top">
      <div class="brand">
        <div class="crown">
          <svg viewBox="0 0 24 24"><path d="M3 18h18l-1.5-10-5 4L12 5l-2.5 7-5-4z"/></svg>
        </div>
        <div>
          <h1>Controle <span class="grad">VIP</span></h1>
          <p class="sub">Entregas mensais · Betas &amp; Similar</p>
        </div>
      </div>
      <div class="top-actions">
        <span id="syncState" class="sync"></span>
        <button class="btn primary" id="saveGh">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
          <span>Salvar no GitHub</span>
        </button>
        <button class="btn icon-btn" id="settingsBtn" title="Configurações">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="month">
        <button class="btn round" id="prevMonth" title="Mês anterior">‹</button>
        <div class="month-label">
          <span class="eyebrow">Mês de referência</span>
          <strong id="monthLabel"></strong>
        </div>
        <button class="btn round" id="nextMonth" title="Próximo mês">›</button>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="eyebrow">Entregues</span>
          <strong id="statDone" class="c-ok">0</strong>
        </div>
        <div class="stat">
          <span class="eyebrow">Pendentes</span>
          <strong id="statPending" class="c-warn">0</strong>
        </div>
        <div class="stat wide">
          <div class="stat-row">
            <span class="eyebrow">Progresso</span>
            <span id="statPct" class="pct">0%</span>
          </div>
          <div class="bar"><div id="statBar" class="bar-fill"></div></div>
        </div>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-cat="betas">Betas <span class="count" id="count-betas"></span></button>
      <button class="tab" data-cat="similar">Similar <span class="count" id="count-similar"></span></button>
    </nav>

    <div class="toolbar">
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar por nome, ID ou e-mail…">
      </div>
      <select id="filter">
        <option value="all">Todos</option>
        <option value="pending">Pendentes</option>
        <option value="done">Entregues</option>
      </select>
      <select id="platFilter">
        <option value="all">Todas plataformas</option>
        <option value="android">Android</option>
        <option value="tablet">Android · Tablet</option>
        <option value="ios">iOS</option>
        <option value="desktop">Desktop</option>
        <option value="none">Sem plataforma</option>
      </select>
      <button class="btn accent" id="addBtn">+ Adicionar</button>
    </div>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty-state" hidden>Nenhum membro aqui.</p>
  </main>

  <!-- Modal genérico -->
  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
